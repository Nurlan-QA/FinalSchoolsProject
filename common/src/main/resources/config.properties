# URL стенда (UI)
base.url=http://localhost:8080

# URL API
api.url=http://localhost:8080

# Таймаут для поиска элементов (мс)
timeout=10000

# Режим логирования (без реализации, только считывается)
log.mode=DEBUG

# Credentials для входа в админку
admin.login=admin
admin.password=secret123

# Невалидные креды для негативных тестов
invalid.login=invalidlogin
invalid.password=invalidpassword

# Имя и цена для стартового товара
product.name=Notebook
product.price=80
# Имя и цена для стартового товара для кейса с высокой ценой
product.bigPrice=350
# Цена для теста обновления товара
product.update.price=100
# Цена для теста с AssertJ в API
product.assertjPrice=88.88

# Защищённые ID (не удаляются в GoodTest @BeforeEach)
protected.ids=50,51,52,53

# Параметры GET /goods/list в тесте testGetListWithGivenWhenThen
api.list.page=0
api.list.size=100

# Тексты уведомлений и ошибок
toast.good.added=Товар успешно добавлен
toast.order.accepted=Заказ принят
error.invalid.credentials=Неверные учетные данные пользователя

# Параметры браузера
browser=chrome
browser.size=1920x1080

# Ограничение суммы для CartFlowOrderTest
cart.max.small.order=300